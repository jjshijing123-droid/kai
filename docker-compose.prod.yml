services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: kai-prod
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=8000
      - CORS_ORIGIN=${CORS_ORIGIN:-https://yourdomain.com}
    volumes:
      # 产品图片目录 - 绑定挂载到宿主机，持久化并可直接管理
      - ./Product:/app/Product
      # 上传临时目录 - 绑定挂载到宿主机
      - ./uploads:/app/uploads
    restart: unless-stopped
