services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: kai-dev
    ports:
      - "3000:3000"
      - "5173:5173"
    env_file: .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      # 挂载源代码 - Vite HMR 需要实时文件同步
      - ./src:/app/src
      - ./server:/app/server
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./package.json:/app/package.json
      # 挂载产品目录 - 持久化到宿主机
      - ./Product:/app/Product
      # 挂载上传临时目录
      - ./uploads:/app/uploads
      # node_modules 独立 volume，避免覆盖宿主机的
      - /app/node_modules
    command: sh -c "node server.js & npx vite --host"
    restart: unless-stopped
